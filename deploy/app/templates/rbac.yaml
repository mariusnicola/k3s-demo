apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher-lease
rules:
  # Kubernetes cannot limit create by resource name.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["dispatcher"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher-lease
subjects:
  - kind: ServiceAccount
    name: dispatcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher-lease
